name: 功能建议
description: 提议可复现、可维护且适合公开协作的功能
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前用户或贡献者遇到的具体问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明公共接口、边界、兼容性和失败行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 请说明已考虑的其他方案及取舍。
  - type: checkboxes
    id: scope
    attributes:
      label: 开源范围
      options:
        - label: 该建议不依赖真实用户数据、内部地址或硬编码密钥。
          required: true
        - label: 该建议可以使用本地 fixture 或 mock 在 CI 中复现。
          required: true
